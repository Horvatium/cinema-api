name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start database and API
        run: docker compose up -d --build --wait
      - name: Log in with the seeded demo account
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -X POST http://localhost:5000/api/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"email":"demo@kinoplex.test","password":"Demo123!"}' \
                 | grep -q '"token"'; then
              echo "API is up and the seed data is loaded"
              exit 0
            fi
            sleep 2
          done
          echo "API did not respond in time"
          exit 1
      # Railway disk za plakate priklopi v lasti root. API se tu zažene z enakim
      # diskom in nanj naloži plakat, kar preveri vstopno skripto v Dockerfilu.
      - name: Upload a poster to a root-owned volume (as on Railway)
        run: |
          sudo mkdir -p /tmp/uploads
          sudo chown root:root /tmp/uploads
          sudo chmod 755 /tmp/uploads
          docker compose stop api
          docker compose run -d --rm --name api-root -p 5001:5000 -v /tmp/uploads:/app/uploads api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5001/health && break
            sleep 2
          done
          TOKEN=$(curl -fsS -X POST http://localhost:5001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@kinoplex.test","password":"Admin123!"}' | jq -r .token)
          # Datoteka z glavo PNG; API preverja začetne bajte
          printf '\x89PNG\r\n\x1a\n0000000000000000' > poster.png
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            -F "poster=@poster.png;type=image/png" \
            http://localhost:5001/api/upload/poster | tee upload.json
          grep -q '/uploads/posters/' upload.json
          sudo ls -la /tmp/uploads/posters
          # Strežnik mora teči kot node, ne kot root
          docker exec api-root ps -o user,args | grep 'node server.js' | grep -v '^root'
      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker logs api-root || true
      - name: Stop
        if: always()
        run: |
          docker stop api-root || true
          docker compose down -v
