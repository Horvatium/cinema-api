# Lokalno razvojno okolje.
#   docker compose up -d db               samo baza (za npm test)
#   docker compose up --build             baza + API
#   docker compose --profile web up --build
#                                         + spletna aplikacija (potrebuje ../cinema-web)
#
# Baza se ob prvem zagonu ustvari iz schema.sql in seed.sql. Predstave v seedu
# so računane od tega dne; za ponovno polnjenje zaženi
#   docker compose down -v

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinema
      TZ: UTC
    ports:
      - '3307:3306'
    volumes:
      - db-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # Ping prek TCP uspe šele, ko so začetne skripte končane in posluša
      # pravi strežnik
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cinema
      DB_SSL: 'false'
      JWT_SECRET: local-dev-secret
      PORT: 5000
      # Plačila potrebujejo testne ključe Stripe: nastavi jih pred `docker compose up`
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      # Brez RESEND_API_KEY se e-pošta ne pošilja
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - '5000:5000'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # /health vrne 200 samo, ko se API lahko poveže z bazo
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [web]
    build:
      context: ../cinema-web
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
